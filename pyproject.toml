[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decent-identity"
version = "0.1.0"
description = "Identity resolver/verification over decent-registry Identity Records"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Ben Eng" } ]

# Dev convenience: expects ../decent-registry to exist side-by-side.
# If this layout changes, switch to publishing decent-registry or install it in the same venv.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["decent_identity*"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-trio>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "acceptance: network/internet-dependent end-to-end tests",
]
